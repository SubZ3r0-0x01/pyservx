[project]
name = "pyservx"
version = "4.0.0"
description = "Secure Python file server: resumable chunked uploads, P2P WebRTC transfers, ephemeral links, token auth, MCP bridge, SFTP access, live dashboard."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["file server", "http server", "file sharing", "resumable upload", "chunked upload", "webrtc", "p2p", "ephemeral links", "token auth", "mcp", "sftp", "ssh", "qrcode", "pyservx"]
authors = [
    { name = "Subz3r0x01", email = "subz3r0x01@protonmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "qrcode",
    "Pillow"
]

[project.optional-dependencies]
ssh = ["paramiko"]
dashboard = ["rich"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { include = ["pyservx*"] }

[project.urls]
Homepage = "https://github.com/SubZ3r0-0x01/pyservx"
Repository = "https://github.com/SubZ3r0-0x01/pyservx"

[project.scripts]
pyservx = "pyservx.server:main"